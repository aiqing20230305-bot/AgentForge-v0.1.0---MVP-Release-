<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>AgentForge 已迁移 · Production moved to Feishu Miaoda</title>
    <meta
      name="description"
      content="AgentForge 生产环境已迁至飞书秒搭。Production has moved to Feishu Miaoda (飞书秒搭)."
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        background: linear-gradient(160deg, #0a0a0f 0%, #111827 50%, #0f172a 100%);
        color: #f8fafc;
        line-height: 1.6;
      }

      .card {
        max-width: 520px;
        width: 100%;
        padding: 40px 32px;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(6, 182, 212, 0.35);
        border-radius: 16px;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
        text-align: center;
      }

      .badge {
        display: inline-block;
        margin-bottom: 20px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #67e8f9;
        background: rgba(6, 182, 212, 0.15);
        border-radius: 999px;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 16px;
        color: #ffffff;
      }

      .lead {
        font-size: 1rem;
        color: #cbd5e1;
        margin-bottom: 8px;
      }

      .lead-en {
        font-size: 0.95rem;
        color: #94a3b8;
        margin-bottom: 28px;
      }

      .cta {
        display: inline-block;
        width: 100%;
        max-width: 360px;
        padding: 14px 24px;
        font-size: 1.05rem;
        font-weight: 600;
        color: #0f172a;
        text-decoration: none;
        background: linear-gradient(135deg, #22d3ee, #06b6d4);
        border-radius: 10px;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        box-shadow: 0 8px 24px rgba(6, 182, 212, 0.35);
      }

      .cta:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 28px rgba(6, 182, 212, 0.45);
      }

      .cta:focus-visible {
        outline: 2px solid #67e8f9;
        outline-offset: 3px;
      }

      .countdown {
        margin-top: 24px;
        font-size: 0.875rem;
        color: #64748b;
      }

      .countdown strong {
        color: #22d3ee;
        font-variant-numeric: tabular-nums;
      }

      .footnote {
        margin-top: 20px;
        font-size: 0.8rem;
        color: #475569;
      }

      .footnote a {
        color: #38bdf8;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <span class="badge">Production migration</span>
      <h1>AgentForge 生产环境已迁移</h1>
      <p class="lead">
        本站点（Vercel）不再提供生产服务。请前往<strong>飞书秒搭</strong>继续使用 AgentForge。
      </p>
      <p class="lead-en">
        This Vercel URL is retired. Production now runs on <strong>Feishu Miaoda</strong> (飞书秒搭).
      </p>
      <a
        class="cta"
        id="goto-miaoda"
        href="https://tezign.feishuapp.com/app/app_17hqyg88mzz"
        rel="noopener noreferrer"
      >
        前往飞书秒搭 · Open Feishu Miaoda
      </a>
      <p class="countdown" id="countdown" aria-live="polite">
        <span lang="zh">约</span> <strong id="seconds">4</strong>
        <span lang="zh"> 秒后自动跳转</span>
        · Auto-redirect in <strong id="seconds-en">4</strong>s
      </p>
      <p class="footnote">
        若未自动跳转，请点击上方按钮或访问<br />
        <a href="https://tezign.feishuapp.com/app/app_17hqyg88mzz"
          >https://tezign.feishuapp.com/app/app_17hqyg88mzz</a
        >
      </p>
    </main>
    <script>
      ;(function () {
        var dest = 'https://tezign.feishuapp.com/app/app_17hqyg88mzz'
        var delayMs = 4000
        var tickMs = 250
        var remaining = delayMs

        var secondsEl = document.getElementById('seconds')
        var secondsEnEl = document.getElementById('seconds-en')

        function updateLabel() {
          var secs = Math.max(1, Math.ceil(remaining / 1000))
          if (secondsEl) secondsEl.textContent = String(secs)
          if (secondsEnEl) secondsEnEl.textContent = String(secs)
        }

        updateLabel()
        var interval = window.setInterval(function () {
          remaining -= tickMs
          if (remaining <= 0) {
            window.clearInterval(interval)
            window.location.replace(dest)
            return
          }
          updateLabel()
        }, tickMs)
      })()
    </script>
  </body>
</html>
