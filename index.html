<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <!-- 移动端视口优化 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

    <!-- PWA配置 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgentForge" />

    <!-- SEO -->
    <title>AgentForge - AI Agent Builder</title>
    <meta name="description" content="Forge your AI agents like legendary heroes | 像锻造传奇英雄一样打造你的 AI Agent" />
    <meta name="keywords" content="AI, Agent, AgentForge, 可视化, 管理, 游戏化, RPG, WoW" />
    <meta name="author" content="AgentForge Team" />

    <!-- Open Graph -->
    <meta property="og:title" content="AgentForge - AI Agent管理平台" />
    <meta property="og:description" content="WoW风格的AI Agent可视化管理系统" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://agentforge.app" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AgentForge - AI Agent管理平台" />
    <meta name="twitter:description" content="WoW风格的AI Agent可视化管理系统" />
    <meta name="twitter:image" content="/twitter-image.png" />

    <!-- 关键CSS内联 -->
    <style>
      /* Critical CSS for initial render */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: #0a0a0a;
        color: #ffffff;
      }

      #root {
        width: 100%;
        height: 100%;
      }

      /* Loading indicator */
      .loading-spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 48px;
        height: 48px;
        border: 4px solid rgba(6, 182, 212, 0.2);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: translate(-50%, -50%) rotate(360deg); }
      }

      .loading-text {
        position: fixed;
        top: 60%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        color: rgba(255, 255, 255, 0.6);
      }
    </style>

    <!-- 字体预加载（延迟加载） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    </noscript>

    <!-- 预加载关键资源 -->
    <link rel="modulepreload" href="/src/main.web.tsx">
    <link rel="preload" href="/manifest.json" as="fetch" crossorigin>

    <!-- 错误捕获 -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('❌ Global Error:', e.error)
        console.error('File:', e.filename, 'Line:', e.lineno)
      })
      window.addEventListener('unhandledrejection', function(e) {
        console.error('❌ Unhandled Promise Rejection:', e.reason)
      })
    </script>
  </head>
  <body class="bg-bg-primary text-text-primary">
    <div id="root">
      <!-- 首屏加载指示器 -->
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading AgentForge...</div>
    </div>

    <!-- 主脚本 - type="module"自动defer -->
    <script type="module" src="/src/main.web.tsx"></script>

    <!-- Service Worker注册（非阻塞） -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Silently fail if SW not available
          });
        });
      }
    </script>
  </body>
</html>
