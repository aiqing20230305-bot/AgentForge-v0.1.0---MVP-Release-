name: 🐛 Bug Report
description: Report a bug in AgentForge
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! 🐛

  - type: textarea
    id: description
    attributes:
      label: Bug Description / 问题描述
      description: A clear description of what the bug is
      placeholder: When I click..., the app...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce / 复现步骤
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior / 期望行为
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / 实际行为
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Which version are you using?
      placeholder: v1.5.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System / 操作系统
      options:
        - macOS
        - Windows
        - Linux
        - Web (Browser)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: Any error messages or logs
      render: shell
