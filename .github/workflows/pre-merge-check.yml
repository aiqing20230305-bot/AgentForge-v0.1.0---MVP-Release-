name: 🚦 Pre-Merge Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Check if tests are added for new code
  test-coverage-check:
    name: Test Coverage Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📊 Generate coverage report
        run: npm run test:coverage

      - name: 📈 Check coverage thresholds
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs'
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'))
          const lines = summary.total.lines.pct
          console.log(`Line coverage: ${lines}%`)
          if (lines < 70) {
            console.error(`Coverage is below 70% threshold. Current coverage: ${lines}%`)
            process.exit(1)
          }
          console.log(`Coverage is above threshold: ${lines}%`)
          EOF

      - name: 💬 Comment PR with coverage
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let body = '## 📊 Test Coverage Report\n\nCoverage report not available.\n\nPlease ensure coverage stays above 70% threshold.';
            try {
              const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = summary.total;
              body = [
                '## 📊 Test Coverage Report',
                '',
                '| Metric | Coverage |',
                '| --- | --- |',
                `| Lines | ${total.lines.pct}% |`,
                `| Statements | ${total.statements.pct}% |`,
                `| Functions | ${total.functions.pct}% |`,
                `| Branches | ${total.branches.pct}% |`,
                '',
                'Line coverage threshold: 70%.'
              ].join('\n');
            } catch (e) {
              console.log('Could not read coverage file');
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # Lint and format check
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript check
        run: npm run typecheck

      - name: 🎨 Check formatting (if prettier is configured)
        run: npx prettier --check "src/**/*.{ts,tsx}" || echo "Prettier not configured, skipping"
        continue-on-error: true

  # Check for security vulnerabilities
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🔒 Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 📝 Comment security findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Security vulnerabilities detected. Please run `npm audit` locally and fix moderate/high severity issues before merging.'
            });

  # Prevent merging if tests fail
  merge-guard:
    name: 🛡️ Merge Guard
    needs: [test-coverage-check, code-quality]
    runs-on: ubuntu-latest

    steps:
      - name: ✅ All checks passed
        run: |
          echo "All pre-merge checks passed!"
          echo "This PR is ready to merge ✅"
