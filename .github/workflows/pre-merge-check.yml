name: 🚦 Pre-Merge Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # Check if tests are added for new code
  test-coverage-check:
    name: Test Coverage Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📊 Generate coverage report
        run: npm run test:coverage
        continue-on-error: true

      - name: 📈 Check coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          # Extract coverage percentages
          LINES=$(grep -oP 'All files\s+\|\s+\K[\d.]+' coverage/coverage-summary.txt | head -1 || echo "0")
          echo "Line coverage: $LINES%"

          # Fail if coverage is below threshold (70%)
          if (( $(echo "$LINES < 70" | bc -l) )); then
            echo "❌ Coverage is below 70% threshold!"
            echo "Current coverage: $LINES%"
            exit 1
          else
            echo "✅ Coverage is above threshold: $LINES%"
          fi

      - name: 💬 Comment PR with coverage
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let coverage = 'Coverage report not available';
            try {
              coverage = fs.readFileSync('coverage/coverage-summary.txt', 'utf8');
            } catch (e) {
              console.log('Could not read coverage file');
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📊 Test Coverage Report\n\n\`\`\`\n${coverage}\n\`\`\`\n\nPlease ensure coverage stays above 70% threshold.`
            });

  # Lint and format check
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 TypeScript check
        run: npm run typecheck

      - name: 🎨 Check formatting (if prettier is configured)
        run: npx prettier --check "src/**/*.{ts,tsx}" || echo "Prettier not configured, skipping"
        continue-on-error: true

  # Check for security vulnerabilities
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 🔒 Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 📝 Comment security findings
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Security vulnerabilities detected. Please run `npm audit` locally and fix moderate/high severity issues before merging.'
            });

  # Prevent merging if tests fail
  merge-guard:
    name: 🛡️ Merge Guard
    needs: [test-coverage-check, code-quality]
    runs-on: ubuntu-latest

    steps:
      - name: ✅ All checks passed
        run: |
          echo "All pre-merge checks passed!"
          echo "This PR is ready to merge ✅"
