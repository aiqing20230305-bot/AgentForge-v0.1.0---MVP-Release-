name: 🌙 Nightly Full Test Suite

on:
  schedule:
    # Run every night at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  comprehensive-tests:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run all unit tests
        run: npm run test:coverage

      - name: 📦 Install Playwright
        run: npx playwright install --with-deps

      - name: 🏗️ Build application
        run: npm run build

      - name: 🧪 Run full E2E test suite
        run: npx playwright test
        env:
          CI: true

      - name: 📊 Generate comprehensive report
        run: |
          echo "# Nightly Test Report" > test-report.md
          echo "" >> test-report.md
          echo "**Date:** $(date)" >> test-report.md
          echo "" >> test-report.md
          echo "## Coverage Summary" >> test-report.md
          echo "\`\`\`" >> test-report.md
          cat coverage/coverage-summary.txt || echo "No coverage data" >> test-report.md
          echo "\`\`\`" >> test-report.md

      - name: 📧 Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Nightly tests failed on ' + new Date().toISOString().split('T')[0],
              body: 'The nightly test suite has failed. Please check the [workflow run](' + context.payload.repository.html_url + '/actions/runs/' + context.runId + ') for details.',
              labels: ['bug', 'automated', 'testing']
            });

  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚡ Run performance benchmarks
        run: |
          echo "Performance benchmarks would run here"
          echo "TODO: Add actual benchmark tests"
        continue-on-error: true

  cleanup:
    name: Cleanup Old Test Artifacts
    runs-on: ubuntu-latest
    needs: [comprehensive-tests]

    steps:
      - name: 🧹 Clean up old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const days = 7;
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);

            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            for (const artifact of artifacts.data.artifacts) {
              const created = new Date(artifact.created_at);
              if (created < cutoff) {
                console.log(`Deleting artifact: ${artifact.name} (${artifact.created_at})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
